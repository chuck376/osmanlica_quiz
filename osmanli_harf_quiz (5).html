<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osmanlıca Harf Quiz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #f8f6f1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 2rem 1rem;
    color: #1a1a1a;
  }

  h1 {
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.12em;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  #mod-screen {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  #mod-screen h2 {
    font-size: 20px;
    font-weight: 400;
    color: #1a1a1a;
    margin-bottom: 0.4rem;
  }

  #mod-screen p {
    font-size: 13px;
    color: #999;
    font-style: italic;
    margin-bottom: 2rem;
  }

  .mod-btn {
    display: block;
    width: 100%;
    background: #ffffff;
    border: 1px solid #e0dbd0;
    border-radius: 12px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 10px;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    overflow: hidden;
  }

  .mod-btn:hover {
    background: #f5f2eb;
    border-color: #c8c0b0;
  }

  .mod-btn-ornek {
    font-size: 26px;
    float: right;
    font-family: 'Scheherazade New', 'Amiri', 'Traditional Arabic', serif;
    direction: rtl;
    color: #ccc;
    line-height: 1;
    margin-top: 2px;
  }

  .mod-btn-baslik {
    font-size: 15px;
    color: #1a1a1a;
    display: block;
    margin-bottom: 3px;
  }

  .mod-btn-aciklama {
    font-size: 12px;
    color: #aaa;
    font-style: italic;
    display: block;
  }

  #stats {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 420px;
    margin-bottom: 1rem;
    font-size: 12px;
    color: #aaa;
    letter-spacing: 0.05em;
  }

  #progress-bar-wrap {
    width: 100%;
    max-width: 420px;
    background: #e8e4dc;
    border-radius: 99px;
    height: 4px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  #progress-bar {
    height: 4px;
    background: #1a1a1a;
    border-radius: 99px;
    transition: width 0.3s;
    width: 0%;
  }

  #card {
    background: #ffffff;
    border: 1px solid #e8e4dc;
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    padding: 2rem 2rem 1.5rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }

  #harf-display {
    font-size: 120px;
    line-height: 1;
    margin-bottom: 0.75rem;
    font-family: 'Scheherazade New', 'Amiri', 'Traditional Arabic', serif;
    color: #1a1a1a;
    border-radius: 12px;
    padding: 1rem;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    direction: rtl;
    border: 1px solid #f0ece4;
  }

  #emoji-display {
    font-size: 48px;
    margin-bottom: 0.5rem;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #kelime-display {
    font-size: 32px;
    font-family: 'Scheherazade New', 'Amiri', 'Traditional Arabic', serif;
    direction: rtl;
    color: #1a1a1a;
    margin-bottom: 0.25rem;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #ipucu {
    font-size: 13px;
    color: #999;
    font-style: italic;
    margin-bottom: 4px;
    min-height: 20px;
  }

  #harf-adi {
    font-size: 12px;
    color: #bbb;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    min-height: 18px;
  }

  #secenekler {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 1.25rem;
  }

  .secsenek {
    background: #ffffff;
    border: 1px solid #e0dbd0;
    border-radius: 10px;
    padding: 14px 10px;
    font-size: 15px;
    font-family: Georgia, serif;
    color: #1a1a1a;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    text-align: center;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .secsenek:hover:not(:disabled) {
    background: #f5f2eb;
    border-color: #c8c0b0;
  }

  .secsenek.dogru {
    background: #eaf5ee;
    border-color: #7cc49a;
    color: #1a6e3a;
  }

  .secsenek.yanlis {
    background: #fdf0f0;
    border-color: #e8a0a0;
    color: #8b2020;
  }

  .secsenek:disabled { cursor: default; }

  #feedback {
    font-size: 14px;
    color: #888;
    min-height: 22px;
    font-style: italic;
    text-align: center;
    margin-bottom: 0.75rem;
  }

  #feedback.dogru { color: #2a7a4a; }
  #feedback.yanlis { color: #8b2020; }

  #next-btn {
    background: #1a1a1a;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 12px 32px;
    font-size: 14px;
    font-family: Georgia, serif;
    letter-spacing: 0.05em;
    cursor: pointer;
    display: none;
    transition: background 0.15s;
  }

  #next-btn:hover { background: #333; }

  #result-screen {
    display: none;
    text-align: center;
    max-width: 420px;
    width: 100%;
  }

  #result-score {
    font-size: 56px;
    font-weight: 400;
    color: #1a1a1a;
    margin-bottom: 0.25rem;
  }

  #result-label {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 2rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  #result-screen h2 {
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 0.5rem;
  }

  #result-screen > p {
    font-size: 14px;
    color: #888;
    font-style: italic;
    margin-bottom: 2rem;
  }

  #yanlis-listesi {
    background: #fff;
    border: 1px solid #e8e4dc;
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    text-align: left;
  }

  #yanlis-listesi h3 {
    font-size: 11px;
    color: #aaa;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 1rem;
    font-weight: 400;
  }

  .yanlis-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid #f0ece4;
    font-size: 14px;
  }

  .yanlis-item:last-child { border-bottom: none; }

  .yanlis-harf {
    font-size: 28px;
    font-family: 'Scheherazade New', 'Amiri', 'Traditional Arabic', serif;
    direction: rtl;
    min-width: 36px;
    text-align: center;
    color: #1a1a1a;
  }

  .yanlis-detail { color: #666; font-size: 13px; }
  .yanlis-detail span { color: #8b2020; }
  .yanlis-detail strong { color: #2a7a4a; }

  .sonuc-butonlar {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .sonuc-btn {
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 14px;
    font-family: Georgia, serif;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.15s;
  }

  #restart-btn {
    background: #1a1a1a;
    color: #fff;
    border: 1px solid #1a1a1a;
  }

  #restart-btn:hover { background: #333; }

  #modchange-btn {
    background: #fff;
    color: #888;
    border: 1px solid #e0dbd0;
  }

  #modchange-btn:hover { background: #f5f2eb; }
</style>
</head>
<body>

<h1>Osmanlıca · Harf Quiz</h1>

<div id="mod-screen">
  <h2>Mod seç</h2>
  <p>33 harfin tamamı, karışık sırada</p>

  <button class="mod-btn" onclick="modBaslat('harf-adi')">
    <span class="mod-btn-ornek">ب</span>
    <span class="mod-btn-baslik">Harf adı</span>
    <span class="mod-btn-aciklama">elif, be, pe, te... hangisi?</span>
  </button>

  <button class="mod-btn" onclick="modBaslat('ses-degeri')">
    <span class="mod-btn-ornek">ث</span>
    <span class="mod-btn-baslik">Ses değeri</span>
    <span class="mod-btn-aciklama">metinde hangi sese karşılık gelir?</span>
  </button>

  <button class="mod-btn" onclick="modBaslat('baglaniş')">
    <span class="mod-btn-ornek">ـبـ</span>
    <span class="mod-btn-baslik">Bağlanış formu</span>
    <span class="mod-btn-aciklama">harfin hangi pozisyonda olduğunu bul</span>
  </button>

</div>

<div id="quiz-screen" style="display:none; width:100%; max-width:420px;">
  <div id="stats">
    <span id="soru-no">1 / 33</span>
    <span id="dogru-sayisi">Doğru: 0</span>
  </div>
  <div id="progress-bar-wrap">
    <div id="progress-bar"></div>
  </div>
  <div id="card">
    <div id="harf-display">ب</div>
    <div id="emoji-display"></div>
    <div id="kelime-display"></div>
    <div id="ipucu"></div>
    <div id="harf-adi"></div>
  </div>
  <div id="secenekler"></div>
  <div id="feedback"></div>
  <button id="next-btn" onclick="nextQuestion()">Sonraki →</button>
</div>

<div id="result-screen">
  <div id="result-score">0/33</div>
  <div id="result-label">Doğru Cevap</div>
  <h2 id="result-baslik">Tebrikler</h2>
  <p id="result-mesaj">Quiz tamamlandı.</p>
  <div id="yanlis-listesi">
    <h3>Tekrar çalışılacaklar</h3>
    <div id="yanlis-items"></div>
  </div>
  <div class="sonuc-butonlar">
    <button class="sonuc-btn" id="modchange-btn" onclick="modSecimineGit()">← Mod seç</button>
    <button class="sonuc-btn" id="restart-btn" onclick="restart()">Tekrar</button>
  </div>
</div>

<script>

  { harf: 'ح', ad: 'ha',              ses: 'h',                   ipucu: 'boğaz "h"sı, derin',              emoji: '🥕', emoji_ad: 'havuç',    kelime: 'خاووج',   kelime_anlam: 'havuç' },

  { harf: 'ظ', ad: 'zı',              ses: 'z (vurgulu)',         ipucu: 'kalın z',                         emoji: null, emoji_ad: null,        kelime: 'ظلم',     kelime_anlam: 'zulüm' },
  { harf: 'ع', ad: 'ayın',            ses: "' (boğaz)",           ipucu: 'gırtlaktan, sessiz gibi okunur', emoji: null, emoji_ad: null,        kelime: 'عشق',     kelime_anlam: 'aşk' },

// ============================================================
// MODLAR
// ============================================================
const MODLAR = {

  'harf-adi': {
    ipucuGoster: false,
    adGoster: false,
    soru: (h) => '',
    cevap: (h) => h.ad,
    secenekler: (h, tum) => {
      const yanlis = karistir(tum.filter(x => x.ad !== h.ad)).slice(0, 3).map(x => x.ad);
      return karistir([h.ad, ...yanlis]);
    },
    goster: (h) => ({ emoji: null, kelime: null }),
  },

  'ses-degeri': {
    ipucuGoster: true,
    adGoster: true,
    soru: (h) => h.ipucu,
    cevap: (h) => h.ses,
    secenekler: (h, tum) => {
      const yanlis = karistir(tum.filter(x => x.ses !== h.ses)).slice(0, 3).map(x => x.ses);
      return karistir([h.ses, ...yanlis]);
    },
    goster: (h) => ({ emoji: null, kelime: null }),
  },

  'baglaniş': {
    ipucuGoster: false,
    adGoster: false,
    soru: (h) => '',
    cevap: (s) => s.pozisyon,
    secenekler: (s, tum) => {
      const dogru = s.pozisyon;
      const tumPoz = ['başta', 'ortada', 'sonda', 'bağımsız'];
      const yanlis = karistir(tumPoz.filter(p => p !== dogru)).slice(0, 3);
      return karistir([dogru, ...yanlis]);
    },
    goster: (s) => ({ emoji: null, kelime: null }),
    ozelSorular: true,
  },

};

// ============================================================
// DURUM
// ============================================================
let mevcutModAdi = null;
let sorular = [];
let mevcutIndex = 0;
let dogruSayisi = 0;
let yanlisList = [];
let cevapVerildi = false;

function karistir(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function ekranGoster(id) {
  ['mod-screen', 'quiz-screen', 'result-screen'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
}

function modBaslat(modAdi) {
  if (!MODLAR[modAdi]) return;
  mevcutModAdi = modAdi;
  const mod = MODLAR[modAdi];
  sorular = karistir(mod.ozelSorular ? BAGLANIS : HARFLER);
  mevcutIndex = 0;
  dogruSayisi = 0;
  yanlisList = [];
  cevapVerildi = false;
  ekranGoster('quiz-screen');
  soruGoster();
}

function soruGoster() {
  const soru = sorular[mevcutIndex];
  const mod = MODLAR[mevcutModAdi];
  cevapVerildi = false;

  const harfGoster = mod.ozelSorular ? soru.form : soru.harf;
  document.getElementById('harf-display').textContent = harfGoster;
  document.getElementById('ipucu').textContent = mod.ipucuGoster ? mod.soru(soru) : (mod.ozelSorular ? soru.harf_adi : '');
  document.getElementById('harf-adi').textContent = mod.adGoster ? soru.ad : '';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';
  document.getElementById('next-btn').style.display = 'none';

  const goster = mod.goster(soru);
  const emojiEl = document.getElementById('emoji-display');
  const kelimeEl = document.getElementById('kelime-display');

  if (goster.emoji) {
    emojiEl.textContent = goster.emoji;
    emojiEl.style.display = 'flex';
  } else {
    emojiEl.textContent = '';
    emojiEl.style.display = 'none';
  }

  if (goster.kelime) {
    kelimeEl.textContent = goster.kelime;
    kelimeEl.style.display = 'flex';
  } else {
    kelimeEl.textContent = '';
    kelimeEl.style.display = 'none';
  }

  const toplam = sorular.length;
  document.getElementById('soru-no').textContent = `${mevcutIndex + 1} / ${toplam}`;
  document.getElementById('dogru-sayisi').textContent = `Doğru: ${dogruSayisi}`;
  document.getElementById('progress-bar').style.width = `${Math.round((mevcutIndex / toplam) * 100)}%`;

  const dogru = mod.ozelSorular ? mod.cevap(soru) : mod.cevap(soru);
  const secenekler = mod.ozelSorular ? mod.secenekler(soru, BAGLANIS) : mod.secenekler(soru, HARFLER);
  const kapsayici = document.getElementById('secenekler');
  kapsayici.innerHTML = '';

  secenekler.forEach(secenek => {
    const btn = document.createElement('button');
    btn.className = 'secsenek';
    btn.textContent = secenek;
    btn.onclick = () => cevapla(secenek, dogru, btn, soru);
    kapsayici.appendChild(btn);
  });
}

function cevapla(secilen, dogru, btn, soru) {
  if (cevapVerildi) return;
  cevapVerildi = true;

  document.querySelectorAll('.secsenek').forEach(b => {
    b.disabled = true;
    if (b.textContent === dogru) b.classList.add('dogru');
  });

  const feedback = document.getElementById('feedback');

  if (secilen === dogru) {
    btn.classList.add('dogru');
    dogruSayisi++;
    feedback.textContent = 'Doğru';
    feedback.className = 'dogru';
  } else {
    btn.classList.add('yanlis');
    feedback.textContent = `Doğru: ${dogru}`;
    feedback.className = 'yanlis';
    yanlisList.push({ harf: soru.harf, ad: soru.ad, dogru, secilen });
  }

  document.getElementById('dogru-sayisi').textContent = `Doğru: ${dogruSayisi}`;
  document.getElementById('next-btn').style.display = 'inline-block';
}

function nextQuestion() {
  mevcutIndex++;
  if (mevcutIndex >= sorular.length) {
    sonucGoster();
  } else {
    soruGoster();
  }
}

function sonucGoster() {
  ekranGoster('result-screen');

  const toplam = sorular.length;
  const oran = dogruSayisi / toplam;

  document.getElementById('result-score').textContent = `${dogruSayisi}/${toplam}`;
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('soru-no').textContent = `${toplam} / ${toplam}`;
  document.getElementById('dogru-sayisi').textContent = `Doğru: ${dogruSayisi}`;

  let baslik, mesaj;
  if (oran >= 0.9)      { baslik = 'Mükemmel';       mesaj = 'Harflere hâkimsin.'; }
  else if (oran >= 0.7) { baslik = 'İyi gidiyorsun'; mesaj = 'Birkaç harf daha pratik ister.'; }
  else if (oran >= 0.5) { baslik = 'Devam et';        mesaj = 'Temeller oturuyor, alıştırma gerekiyor.'; }
  else                  { baslik = 'Başlangıç';        mesaj = 'Tekrar et, her seferinde daha iyi olacak.'; }

  document.getElementById('result-baslik').textContent = baslik;
  document.getElementById('result-mesaj').textContent = mesaj;

  const yanlisBolumu = document.getElementById('yanlis-listesi');
  const yanlisItems = document.getElementById('yanlis-items');
  yanlisItems.innerHTML = '';

  if (yanlisList.length === 0) {
    yanlisBolumu.style.display = 'none';
  } else {
    yanlisBolumu.style.display = 'block';
    yanlisList.forEach(y => {
      const div = document.createElement('div');
      div.className = 'yanlis-item';
      div.innerHTML = `
        <span class="yanlis-harf">${y.harf}</span>
        <div class="yanlis-detail">
          <div>${y.ad}</div>
          <div><span>${y.secilen}</span> → <strong>${y.dogru}</strong></div>
        </div>
      `;
      yanlisItems.appendChild(div);
    });
  }
}

function restart() { modBaslat(mevcutModAdi); }
function modSecimineGit() { ekranGoster('mod-screen'); }

ekranGoster('mod-screen');
</script>
